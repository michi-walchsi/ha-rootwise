<helmet>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;700&amp;family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0d100e}
.rw{--bg:#0d100e;--bar:#121613;--surface:#161b17;--surface2:#1e2520;--line:#2b352e;--text:#e8eee8;--text2:#b5c0b7;--muted:#8d9a90;--accent:#48a566;--accent-ink:#07110a;--accent-soft:rgba(72,165,102,.16);--water:#3e8fd4;--water-ink:#06111c;--water-soft:rgba(62,143,212,.18);--warn:#c4821a;--warn-soft:rgba(196,130,26,.18);--prob:#c064d2;--prob-soft:rgba(192,100,210,.17);--scrim:rgba(0,0,0,.5);color-scheme:dark}
.rw[data-theme="light"]{--bg:#f3f5f0;--bar:#ffffff;--surface:#ffffff;--surface2:#edf1ea;--line:#d6ddd3;--text:#16201a;--text2:#3d4c41;--muted:#5b695f;--accent:#2e7d4a;--accent-ink:#ffffff;--accent-soft:rgba(46,125,74,.12);--water:#1f6fb2;--water-ink:#ffffff;--water-soft:rgba(31,111,178,.12);--warn:#a8620a;--warn-soft:rgba(168,98,10,.13);--prob:#9a3fb0;--prob-soft:rgba(154,63,176,.12);--scrim:rgba(20,30,24,.3);color-scheme:light}
.rw,.rw *{box-sizing:border-box}
.rw button,.rw input{font:inherit;color:inherit}
.rw button{cursor:pointer}
.rw a{color:inherit;text-decoration:none}
.rw button:focus-visible,.rw a:focus-visible,.rw input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.rw .d{font-family:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;letter-spacing:-.01em}
.rw .num{font-variant-numeric:tabular-nums}
.rw .cap{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
@media (prefers-reduced-motion:reduce){.rw *{transition:none!important;animation:none!important}}
</style>
</helmet>
