[project]
name = "ha-rootwise"
version = "0.2.1"
description = "Rootwise: houseplant care for Home Assistant"
requires-python = ">=3.14.2"
license = "MIT"

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ASYNC", "PL", "D"]
ignore = [
  "D203",
  "D213",
  "PLR0911",
  "PLR0912",
  "PLR0913",
  "PLR2004",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "PLR2004", "S101"]
"dev/**" = ["D", "T201", "E501", "ASYNC240"]
".claude/**" = ["D", "T201", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components.rootwise"]
force-sort-within-sections = true
combine-as-imports = true

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["custom_components.rootwise.engine.*"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["custom_components/rootwise"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
