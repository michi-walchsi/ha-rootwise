log_care:
  target:
    entity:
      integration: rootwise
  fields:
    care_type:
      required: true
      default: watered
      selector:
        select:
          translation_key: care_type
          options:
            - watered
            - fertilized
            - repotted
            - cleaned
            - rotated
            - pest_check
            - pruned
            - sensor_moved
            - note
    note:
      selector:
        text:
    when:
      selector:
        datetime:

snooze:
  target:
    entity:
      integration: rootwise
  fields:
    days:
      default: 1
      selector:
        number:
          min: 0.1
          max: 60
          step: 0.5
          unit_of_measurement: d

set_vacation:
  fields:
    enabled:
      required: true
      default: true
      selector:
        boolean:
    until:
      selector:
        datetime:

upload_photo:
  target:
    entity:
      integration: rootwise
  fields:
    file_path:
      example: /media/kamera/balkon.jpg
      selector:
        text:
    camera:
      selector:
        entity:
          domain: camera
    note:
      selector:
        text:
