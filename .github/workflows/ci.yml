name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: ruff + mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - run: pip install -r requirements_test.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy custom_components/rootwise

  tests:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - run: pip install -r requirements_test.txt
      - name: Engine tests (coverage gate 85 %)
        run: pytest tests/engine --cov=custom_components/rootwise/engine --cov-report=term-missing --cov-fail-under=85
      - name: All tests (coverage gate 80 %)
        run: pytest --cov=custom_components/rootwise --cov-report=term-missing --cov-fail-under=80
